services:
  web:
    build:
      context: .
      # Ganti nilai berikut saat build bila perlu:
      # build args: --build-arg NEXT_PUBLIC_APP_URL=http://app.example.com
      args:
        NEXT_PUBLIC_APP_NAME: "WaliKelas"
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    image: wali-kelas-app:latest
    container_name: wali-kelas-app
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/walikelas?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/walikelas?schema=public"
      AUTH_SECRET: "change-this-secret-key"
      NEXT_PUBLIC_APP_NAME: "WaliKelas"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s